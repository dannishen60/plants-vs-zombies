<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<body>
<title>Plants vs. Zombies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@400;700&display=swap">
<style>
  :root { --bg: #16261a; --ink: #e9dcb8; color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Nunito", "Segoe UI", Arial, sans-serif; overflow: hidden; touch-action: none; }
  #game { position: absolute; left: 0; top: 0; display: block; image-rendering: auto; cursor: crosshair; }
  #note { position: fixed; left: 8px; bottom: 4px; font-size: 11px; color: rgba(233,220,184,0.45); pointer-events: none; }
</style>
<canvas id="game" width="1000" height="650"></canvas>
<div id="note">Fan-made remake. Original code and art.</div>
<script>
"use strict";

/* ============================================================
   Plants vs. Zombies fan remake - core: constants, RNG, save, audio, input
   ============================================================ */
const W = 1000, H = 650, COLS = 9;
const LAWN_X = 90, CELL_W = 90, LAWN_Y = 110;
const RECHARGE = { fast: 7.5, slow: 30, veryslow: 50 };

const AREAS = {
  day:   { name: 'Day',   rows: 5, water: [],     night: false, roof: false, fog: false },
  night: { name: 'Night', rows: 5, water: [],     night: true,  roof: false, fog: false },
  pool:  { name: 'Pool',  rows: 6, water: [2, 3], night: false, roof: false, fog: false },
  fog:   { name: 'Fog',   rows: 6, water: [2, 3], night: true,  roof: false, fog: true },
  roof:  { name: 'Roof',  rows: 5, water: [],     night: false, roof: true,  fog: false },
  moon:  { name: 'Roof (Night)', rows: 5, water: [], night: true, roof: true, fog: false },
};

/* ---------- RNG (seedable) ---------- */
const RNG = {
  s: (Date.now() >>> 0) || 1,
  seed(v) { RNG.s = (v >>> 0) || 1; },
  next() { let t = (RNG.s += 0x6D2B79F5) >>> 0; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; },
  range(a, b) { return a + (b - a) * RNG.next(); },
  int(a, b) { return Math.floor(RNG.range(a, b + 1)); },
  pick(arr) { return arr[Math.floor(RNG.next() * arr.length)]; },
  chance(p) { return RNG.next() < p; },
  shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(RNG.next() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; },
};
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

/* ---------- Save data ---------- */
const SAVE_KEY = 'pvz-remake-save-v1';
function defaultSave() {
  return {
    adventure: { next: 0, completed: [], finished: false, playthroughs: 0 },
    adventure2: { next: 0, completed: [], finished: false },
    plants: ['peashooter', 'mudshooter'],
    coins: 0,
    shop: { slots: 6, poolCleaner: false, roofCleaner: false, rake: 0, firstAid: false, upgrades: {}, imitater: false, zenBought: {} },
    unlocked: { almanac: false, shop: false, minigames: false, puzzle: false, survival: false, zen: false },
    trophies: { minigames: {}, puzzle: {}, survival: {} },
    survivalBest: {},
    zen: { plants: [], water: 0, fertilizer: 0, bugspray: 0, chocolate: 0, lastVisit: 0, gloves: false, wheelbarrow: false, phonograph: false, can: true },
    almanacSeen: { plants: [], zombies: [] },
    options: { sound: true, music: true, speed: 1 },
    stats: { zombiesKilled: 0, plantsPlanted: 0, levelsWon: 0 },
  };
}
const Save = {
  data: defaultSave(),
  load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        const base = defaultSave();
        for (const k in base) {
          if (d[k] === undefined) d[k] = base[k];
          else if (typeof base[k] === 'object' && !Array.isArray(base[k])) for (const kk in base[k]) if (d[k][kk] === undefined) d[k][kk] = base[k][kk];
        }
        Save.data = d;
      }
      for (const t of ['mudshooter'].concat(typeof CUSTOM_ORDER !== 'undefined' ? CUSTOM_ORDER : [])) if (!Save.data.plants.includes(t)) Save.data.plants.push(t);
    } catch (e) { /* storage unavailable: keep defaults */ }
    return Save.data;
  },
  save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(Save.data)); } catch (e) { } },
  reset() { Save.data = defaultSave(); Save.save(); },
  hasPlant(t) { return Save.data.plants.includes(t); },
  unlockPlant(t) { if (!Save.data.plants.includes(t)) Save.data.plants.push(t); },
};

/* ---------- Audio (procedural, no external assets) ---------- */
const Sfx = {
  ctx: null, master: null, musicGain: null, musicTimer: null, musicOn: false, area: 'day', step: 0, nextNote: 0,
  init() {
    if (Sfx.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      Sfx.ctx = new AC();
      Sfx.master = Sfx.ctx.createGain(); Sfx.master.gain.value = 0.5; Sfx.master.connect(Sfx.ctx.destination);
      Sfx.musicGain = Sfx.ctx.createGain(); Sfx.musicGain.gain.value = 0.16; Sfx.musicGain.connect(Sfx.master);
    } catch (e) { Sfx.ctx = null; }
  },
  resume() { if (Sfx.ctx && Sfx.ctx.state === 'suspended') Sfx.ctx.resume(); },
  tone(freq, dur, type, vol, slide, delay) {
    type = type || 'square'; vol = vol || 0.2; slide = slide || 0; delay = delay || 0;
    if (!Sfx.ctx || !Save.data.options.sound) return;
    const c = Sfx.ctx, t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(Sfx.master); o.start(t0); o.stop(t0 + dur + 0.02);
  },
  noise(dur, vol, delay, lp) {
    vol = vol || 0.2; delay = delay || 0; lp = lp || 1200;
    if (!Sfx.ctx || !Save.data.options.sound) return;
    const c = Sfx.ctx, t0 = c.currentTime + delay;
    const buf = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate);
    const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp;
    const g = c.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(Sfx.master); s.start(t0);
  },
  play(name) {
    if (!Sfx.ctx) return;
    switch (name) {
      case 'click': Sfx.tone(600, 0.05, 'square', 0.08); break;
      case 'plant': Sfx.noise(0.12, 0.25, 0, 600); Sfx.tone(180, 0.1, 'triangle', 0.15, -80); break;
      case 'shovel': Sfx.noise(0.15, 0.3, 0, 900); break;
      case 'sun': Sfx.tone(880, 0.08, 'sine', 0.15); Sfx.tone(1320, 0.12, 'sine', 0.12, 0, 0.06); break;
      case 'coin': Sfx.tone(1200, 0.06, 'square', 0.1); Sfx.tone(1800, 0.14, 'square', 0.1, 0, 0.06); break;
      case 'diamond': for (let i = 0; i < 4; i++) Sfx.tone(1000 + i * 300, 0.12, 'sine', 0.12, 0, i * 0.07); break;
      case 'pea': Sfx.tone(700, 0.05, 'square', 0.05, -300); break;
      case 'hit': Sfx.noise(0.05, 0.18, 0, 2500); break;
      case 'splat': Sfx.noise(0.12, 0.25, 0, 700); Sfx.tone(150, 0.1, 'triangle', 0.15, -60); break;
      case 'chomp': Sfx.tone(120, 0.15, 'sawtooth', 0.25, -60); Sfx.noise(0.1, 0.2); break;
      case 'bite': Sfx.noise(0.06, 0.12, 0, 1500); break;
      case 'explode': Sfx.noise(0.6, 0.6, 0, 400); Sfx.tone(80, 0.5, 'sawtooth', 0.3, -60); break;
      case 'freeze': Sfx.tone(1600, 0.4, 'sine', 0.15, -1200); Sfx.noise(0.3, 0.1, 0, 4000); break;
      case 'groan': Sfx.tone(90 + Math.random() * 40, 0.5, 'sawtooth', 0.12, -20); break;
      case 'mower': Sfx.noise(0.9, 0.35, 0, 500); Sfx.tone(120, 0.9, 'sawtooth', 0.2, 40); break;
      case 'wave': Sfx.tone(220, 0.3, 'sawtooth', 0.2); Sfx.tone(165, 0.5, 'sawtooth', 0.2, 0, 0.25); break;
      case 'lose': [330, 311, 294, 262].forEach((f, i) => Sfx.tone(f, 0.45, 'sawtooth', 0.2, 0, i * 0.35)); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => Sfx.tone(f, 0.25, 'square', 0.15, 0, i * 0.13)); Sfx.tone(1047, 0.6, 'square', 0.15, 0, 0.55); break;
      case 'bounce': Sfx.tone(300, 0.1, 'triangle', 0.15, 200); break;
      case 'lob': Sfx.tone(400, 0.15, 'sine', 0.1, 300); break;
      case 'magnet': Sfx.tone(200, 0.3, 'sawtooth', 0.12, 600); break;
      case 'buzz': Sfx.tone(60, 0.2, 'sawtooth', 0.2); break;
      case 'crack': Sfx.noise(0.08, 0.3, 0, 3000); Sfx.tone(500, 0.08, 'square', 0.08, -200); break;
      case 'whack': Sfx.noise(0.08, 0.4, 0, 800); Sfx.tone(200, 0.1, 'triangle', 0.2, -100); break;
      case 'error': Sfx.tone(200, 0.15, 'square', 0.1, -50); break;
      case 'ready': Sfx.tone(440, 0.15, 'square', 0.12); break;
      case 'go': Sfx.tone(660, 0.25, 'square', 0.15); Sfx.tone(880, 0.3, 'square', 0.12, 0, 0.1); break;
      case 'boss': Sfx.tone(60, 1.2, 'sawtooth', 0.3, 20); Sfx.noise(0.8, 0.3, 0, 300); break;
      case 'laugh': [200, 250, 200, 250, 300].forEach((f, i) => Sfx.tone(f, 0.12, 'sawtooth', 0.15, 0, i * 0.12)); break;
      case 'pop': Sfx.tone(900, 0.08, 'square', 0.12, -500); break;
      case 'drop': Sfx.tone(300, 0.25, 'triangle', 0.15, -200); break;
    }
  },
  /* tiny generative music: original patterns per area */
  startMusic(area) {
    Sfx.area = area || 'day';
    if (!Sfx.ctx || Sfx.musicOn) return;
    Sfx.musicOn = true; Sfx.step = 0; Sfx.nextNote = Sfx.ctx.currentTime + 0.1;
    Sfx.musicTimer = setInterval(Sfx.schedule, 200);
  },
  setArea(area) { Sfx.area = area; },
  stopMusic() { Sfx.musicOn = false; if (Sfx.musicTimer) clearInterval(Sfx.musicTimer); Sfx.musicTimer = null; },
  schedule() {
    if (!Sfx.ctx || !Sfx.musicOn) return;
    if (!Save.data.options.music) { Sfx.nextNote = Sfx.ctx.currentTime + 0.2; return; }
    const c = Sfx.ctx;
    const pats = {
      day:   { bpm: 118, bass: [0, 0, 7, 7, 5, 5, 3, 3], mel: [12, 14, 16, 19, 16, 14, 12, 7, 12, 14, 16, 19, 21, 19, 16, 14], root: 55, wave: 'triangle' },
      night: { bpm: 96,  bass: [0, 0, 5, 5, 3, 3, 8, 8], mel: [12, -1, 15, 12, 17, -1, 15, 12, 10, -1, 12, 15, 14, -1, 12, -1], root: 49, wave: 'sine' },
      pool:  { bpm: 126, bass: [0, 7, 5, 7, 0, 7, 3, 7], mel: [12, 16, 19, 16, 12, 16, 19, 23, 21, 19, 16, 14, 12, 14, 16, 19], root: 58, wave: 'triangle' },
      fog:   { bpm: 100, bass: [0, 0, 6, 6, 5, 5, 3, 3], mel: [12, -1, 13, -1, 15, -1, 13, -1, 12, -1, 10, -1, 8, -1, 10, -1], root: 46, wave: 'sine' },
      roof:  { bpm: 132, bass: [0, 0, 5, 5, 7, 7, 5, 5], mel: [12, 15, 17, 19, 17, 15, 12, 15, 19, 22, 19, 17, 15, 17, 15, 12], root: 62, wave: 'square' },
      moon:  { bpm: 120, bass: [0, 0, 3, 3, 5, 5, 3, 3], mel: [12, 15, 12, 17, 12, 15, 12, 10, 12, 15, 12, 19, 17, 15, 12, 10], root: 49, wave: 'square' },
      boss:  { bpm: 140, bass: [0, 0, 1, 1, 0, 0, 6, 6], mel: [12, 12, 13, 12, 18, 12, 13, 12, 12, 12, 13, 12, 11, 12, 13, 18], root: 41, wave: 'sawtooth' },
      menu:  { bpm: 110, bass: [0, 0, 5, 5, 7, 7, 5, 5], mel: [12, 16, 19, 24, 19, 16, 12, 16, 14, 17, 21, 24, 21, 17, 14, 17], root: 55, wave: 'triangle' },
      zen:   { bpm: 84,  bass: [0, 0, 4, 4, 5, 5, 4, 4], mel: [12, -1, 16, -1, 19, -1, 16, -1, 14, -1, 17, -1, 21, -1, 17, -1], root: 55, wave: 'sine' },
    };
    const p = pats[Sfx.area] || pats.day;
    const beat = 60 / p.bpm / 2;
    while (Sfx.nextNote < c.currentTime + 0.5) {
      const t0 = Sfx.nextNote, i = Sfx.step;
      const bn = p.bass[Math.floor(i / 2) % p.bass.length];
      if (i % 2 === 0) Sfx.mnote(p.root * Math.pow(2, bn / 12), t0, beat * 1.8, 'sawtooth', 0.09);
      const mn = p.mel[i % p.mel.length];
      if (mn >= 0) Sfx.mnote(p.root * Math.pow(2, mn / 12), t0, beat * 0.9, p.wave, 0.07);
      if (i % 4 === 0) Sfx.mperc(t0, i % 8 === 0 ? 90 : 160);
      Sfx.nextNote += beat; Sfx.step++;
    }
  },
  mnote(f, t0, dur, type, vol) {
    const c = Sfx.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(Sfx.musicGain); o.start(t0); o.stop(t0 + dur + 0.05);
  },
  mperc(t0, f) {
    const c = Sfx.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(f, t0); o.frequency.exponentialRampToValueAtTime(30, t0 + 0.12);
    g.gain.setValueAtTime(0.25, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
    o.connect(g); g.connect(Sfx.musicGain); o.start(t0); o.stop(t0 + 0.2);
  },
};

/* ---------- Input ---------- */
const Input = {
  x: -1, y: -1, down: false, clicked: false, rclicked: false, wheel: 0, keys: {}, keyQueue: [],
  attach(canvas, toLogical) {
    const pos = e => { const p = toLogical(e.clientX, e.clientY); Input.x = p.x; Input.y = p.y; };
    canvas.addEventListener('pointermove', e => pos(e));
    canvas.addEventListener('pointerdown', e => { pos(e); Sfx.init(); Sfx.resume(); if (e.button === 2) Input.rclicked = true; else { Input.down = true; Input.clicked = true; } e.preventDefault(); });
    canvas.addEventListener('pointerup', e => { pos(e); Input.down = false; Input.released = true; });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('wheel', e => { Input.wheel += Math.sign(e.deltaY); e.preventDefault(); }, { passive: false });
    window.addEventListener('keydown', e => { Input.keys[e.key] = true; Input.keyQueue.push(e.key); if (e.key === ' ') e.preventDefault(); });
    window.addEventListener('keyup', e => { Input.keys[e.key] = false; });
  },
  endFrame() { Input.clicked = false; Input.rclicked = false; Input.released = false; Input.wheel = 0; Input.keyQueue.length = 0; },
  inRect(x, y, w, h) { return Input.x >= x && Input.x <= x + w && Input.y >= y && Input.y <= y + h; },
};

/* ---------- Layout helpers (depend on current level rows) ---------- */
const Layout = {
  rows: 5, cellH: 100, roof: false, water: [],
  set(area) { Layout.rows = area.rows; Layout.cellH = area.rows === 6 ? 85 : 100; Layout.roof = !!area.roof; Layout.water = area.water || []; },
  cellX(c) { return LAWN_X + c * CELL_W; },
  cellCX(c) { return LAWN_X + c * CELL_W + CELL_W / 2; },
  cellY(r) { return LAWN_Y + r * Layout.cellH; },
  cellBottom(r) { return LAWN_Y + (r + 1) * Layout.cellH - 6; },
  colAt(x) { return Math.floor((x - LAWN_X) / CELL_W); },
  rowAt(y) { return Math.floor((y - LAWN_Y) / Layout.cellH); },
  // roof: left part slopes upward; returns pixels to subtract from y at horizontal x
  lift(x) { if (!Layout.roof) return 0; const flat = Layout.cellX(5) + 10; return x < flat ? (flat - x) * 0.2 : 0; },
  isWater(r) { return Layout.water.includes(r); },
  lawnRight() { return LAWN_X + COLS * CELL_W; },
};


/* ============================================================

          ground (walk-over, not eaten), noRoof, upgradeOf, shield (pumpkin)

const PLANTS = {

function vehicleCrush(z, dt, opts = {}) {
  // drives left, destroys plants in the cell in front; spikeweed pops the tires
  const frontC = Layout.colAt(z.x - 42);
  if (frontC >= 0 && frontC < COLS) {
    const cell = L.cells[z.row][frontC];
    if (cell.plant && cell.plant.def.ground && Math.abs(z.x - 42 - cell.plant.x) < 30) {
      const sp = cell.plant; if (sp.type === 'spikerock') { sp.dur -= 1; if (sp.dur <= 0) killPlant(sp); } else killPlant(sp);
      addFx('pop', z.x - 30, zombieY(z) - 30); killZombie(z, 'pop'); return true;
    }
    if (Math.abs(z.x - 40 - Layout.cellCX(frontC)) < 30) destroyCell(z.row, frontC, 'crush');
    // hypnotized zombies in front get crushed
    for (const o of L.zombies) if (o.hypno && !o.dead && o.row === z.row && Math.abs(o.x - (z.x - 40)) < 30) killZombie(o, 'crush');
  }
  z.state = 'walking'; z.x -= zombieSpeed(z) * dt;
  if (opts.ice) { const back = Layout.colAt(z.x + 10); if (back >= 0 && back < COLS) { const cell = L.cells[z.row][back]; if (!cell.plant && !cell.base) cell.ice = Math.max(cell.ice, 30); } }
  return true;
}
function vaultOver(z, dt, dist) {
  // generic jump used by pole vaulter, dolphin, pogo
  z.vt += dt; const k = Math.min(1, z.vt / 0.7);
  z.x = lerp(z.vx0, z.vx0 - dist, k); z.yOff = -Math.sin(k * Math.PI) * 70;
  if (k >= 1) { z.yOff = 0; z.state = 'walking'; return true; }
  return false;
}

}

    const ball = L.bossBalls[i];

SPECIAL_UPDATE.zomboss = (dt) => {
  const b = L.boss; b.t += dt; if (b.hurt > 0) b.hurt -= dt;
  const hard = b.hard, fast = b.hp < b.maxHp * 0.5;
  if (b.dead) { b.deadT += dt; if (Math.random() < dt * 8) addFx('boom', b.x - RNG.range(0, 160), RNG.range(120, 560), { rx: 0.4, ry: 0.4 }); if (b.deadT > 3.5) winLevel(); return; }
  // balls
  for (let i = L.bossBalls.length - 1; i >= 0; i--) {
    const ball = L.bossBalls[i]; ball.x -= 95 * dt; ball.spin += dt * 6;
    const c = Layout.colAt(ball.x);
    if (c >= 0 && c < COLS) { destroyCell(ball.row, c, 'crush'); if (ball.kind === 'ice') L.cells[ball.row][c].ice = Math.max(L.cells[ball.row][c].ice, 20); const p = L.cells[ball.row][c].plant; if (p && p.def.ground) killPlant(p, 'crush'); }
    for (const z of L.zombies) if (!z.dead && z.row === ball.row && Math.abs(z.x - ball.x) < 40 && z.hypno) killZombie(z, 'crush');
    if (ball.x < LAWN_X - 30) L.bossBalls.splice(i, 1);

    case 'enter': if (b.t > 2.5) { b.state = 'idle'; b.t = 0; b.cd = 2; } break;
    case 'idle':
      if (b.t > b.cd) {
        const r = RNG.next();
        const total = L.zombies.filter(z => !z.dead).length;
        if (total < 3 || r < 0.34) { b.state = 'summon'; b.t = 0; b.summoned = 0; b.summonN = (hard ? 4 : 3) + (fast ? 1 : 0); }
        else if (r < 0.58) { b.state = 'stomp'; b.t = 0; const rows = L.rows.filter(rr => rr < Layout.rows - 1); b.tele = { r: RNG.pick(rows), c: RNG.int(4, 6) }; }
        else if (r < 0.82) { b.state = 'ball'; b.t = 0; b.ballKind = RNG.chance(0.5) ? 'fire' : 'ice'; b.tele = { r: RNG.pick(L.rows) }; }
        else { b.state = 'rv'; b.t = 0; b.tele = { r: clamp(RNG.int(0, Layout.rows - 1), 1, Layout.rows - 2), c: RNG.int(2, 6) }; }

    case 'summon':

      break;

/* ---------- level integration ---------- */
(function integrate() {
  // bonus plants: each adventure level after the first also unlocks one expansion plant
  const bonus = EXTRA_PLANT_ORDER.slice();
  let bi = 0;
  ADVENTURE.forEach((def, i) => { if (i === 0 || def.special === 'zomboss') return; if (bi < bonus.length) def.bonus = bonus[bi++]; });
  // extra zombies per world
  const worlds = [
    { from: 1, to: 12, add: { trashcan: [1, 6], peasant: [2, 4] } },
    { from: 13, to: 22, add: { swashbuckler: [2, 4], knight: [1, 7], jester: [1, 8] } },
    { from: 23, to: 32, add: { bikini: [3, 1], seagull: [2, 3], barrelroller: [2, 4], piratecaptain: [1, 6], fisherman: [1, 6], surfer: [2, 5], prospector: [1, 7] } },
    { from: 33, to: 42, add: { impcannon: [1, 8], octo: [1, 7], pianist: [1, 8], chickenwrangler: [2, 4], poncho: [2, 3], bull: [1, 7], wizard: [1, 6], jester: [1, 6], hunter: [1, 5], camel: [1, 5] } },
    { from: 43, to: 51, add: { jetpack: [2, 3], shieldzombie: [1, 5], robocone: [1, 6], mechafootball: [1, 9], gargprime: [1, 14], weaselhoarder: [1, 5], excavator: [1, 6], parasol: [1, 5], punk: [1, 5], mczomb: [1, 8], boombox: [1, 8], gigafootball: [1, 12], gigagargantuar: [1, 20] } },
  ];
  for (const w of worlds) for (let i = w.from; i <= w.to; i++) { const def = ADVENTURE[i]; if (!def || def.special === 'vase' || def.special === 'whack' || def.special === 'bowling') continue; for (const k in w.add) if (!def.zombies[k]) def.zombies[k] = w.add[k].slice(); }
  // Zomboss fights get a few extras
  for (const def of [ADVENTURE[ADVENTURE.length - 1], MINIGAMES.find(m => m.id === 'revenge')]) Object.assign(def.zombies, { gargprime: 1, robocone: 2, jetpack: 3, knight: 2 });
  // survival and endless draw from everything
  const all = { swashbuckler: 2, seagull: 2, barrelroller: 2, piratecaptain: 1, octo: 1, prospector: 1, pianist: 1, chickenwrangler: 1, poncho: 2, bull: 1, jetpack: 2, shieldzombie: 1, robocone: 1, mechafootball: 1, gargprime: 1, peasant: 2, knight: 2, wizard: 1, jester: 1, hunter: 1, weaselhoarder: 1, excavator: 1, parasol: 1, punk: 1, mczomb: 1, boombox: 1, trashcan: 1, gigafootball: 1, gigagargantuar: 1 };
  for (const s of SURVIVAL) { for (const k in all) if (!s.zombies[k]) s.zombies[k] = s.hard || s.endless ? [all[k], 0] : [all[k], 10]; if (s.area === 'pool' || s.area === 'fog') { s.zombies.bikini = 3; s.zombies.fisherman = 1; s.zombies.surfer = 2; } }
  for (const m of MINIGAMES) if (m.id === 'laststand' || m.id === 'column' || m.id === 'portalcombat') Object.assign(m.zombies, { mummy: [3, 5], knight: [1, 12], jetpack: [1, 15], punk: [1, 15] });
})();

function usePlantFood(p) {

  const def = p.def, t = p.type;
  const zs = L.zombies.filter(z => !z.dead && !z.def.boss && z.state !== 'underground');
  if (t === 'thunderbean') {

    for (const z of zs) { if (RNG.chance(0.87)) { hitZombie(z, 99999, { kind: 'explosion' }); killed++; } else hitZombie(z, 300, { kind: 'explosion' }); addFx('bolt', z.x, zombieY(z) - 60, { dur: 0.8 }); }

}

      if (p.stage < 3) p.need = RNG.chance(0.6) ? 'water' : 'fertilizer';
      else { const r = RNG.next(); p.need = r < 0.5 ? 'water' : r < 0.75 ? 'bugspray' : 'phonograph'; }

  for (let i = UI.zen.coins.length - 1; i >= 0; i--) { const c = UI.zen.coins[i]; c.t += dt; if (c.t > 12) UI.zen.coins.splice(i, 1); }
}

function drawNeedIcon(need, x, y) {

function zenClick() {

function pauseClick() {

/* ---------- in-level clicks ---------- */
function collectPickupAt(x, y) {
  for (const list of [L.suns, L.coins, L.drops]) for (const s of list) { if (s.state === 'collect' || s.state === 'pull') continue; if (dist(x, y, s.x, s.y) < 32) { if (s.kind === 'sun') collectSun(s); else if (s.kind === 'coin') { collectCoin(s); Sfx.play('coin'); } else { s.state = 'collect'; Sfx.play('click'); } return true; } }

}

function levelKey(k) {

  const n = parseInt(k); if (!isNaN(n) && !L.conveyor && !L.izombie) { const i = n === 0 ? 9 : n - 1; if (L.seeds[i]) { const s = L.seeds[i]; if (s.cd <= 0 && L.sun >= seedCost(s.type, s)) L.selected = { kind: 'seed', i }; else Sfx.play('error'); } }

/* ============================================================
   Bootstrap: canvas, main loop, screen dispatch
   ============================================================ */
const canvas = document.getElementById('game');
let view = { scale: 1, ox: 0, oy: 0 };
function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);

  const s = Math.min(ww / W, wh / H);
  view.scale = s; view.ox = (ww - W * s) / 2; view.oy = (wh - H * s) / 2;
  canvas.width = Math.round(W * s * dpr); canvas.height = Math.round(H * s * dpr);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.left = Math.round(view.ox) + 'px'; canvas.style.top = Math.round(view.oy) + 'px';

  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
}

window.addEventListener('resize', resize);
resize();
Input.attach(canvas, toLogical);
Save.load();
for (const t of CUSTOM_ORDER) if (!Save.data.plants.includes(t)) Save.data.plants.push(t);
applyWorldTwoGift();

let last = performance.now(), acc = 0;
function frame(now) {

  let dt = Math.min(0.1, (now - last) / 1000); last = now;
  UI.t += dt; G.time += dt;
  // keys

    if (G.screen === 'level' && L) levelKey(k);
    else if (k === 'Escape') { if (G.screen !== 'menu' && G.screen !== 'dave' && G.screen !== 'seeds') G.screen = 'menu'; }
  }
  if (Input.rclicked && G.screen === 'level' && L && L.selected && L.selected.kind !== 'vaseplant') L.selected = null;
  // update
  if (G.screen === 'level' && L) {
    if (!UI.pause) {
      const steps = G.fast ? 2 : 1;
      for (let i = 0; i < steps; i++) {
        const sdt = dt;
        for (const s of L.seeds) if (s.cd > 0) s.cd -= sdt * (L.speedMul || 1);
        updateLevel(sdt);
        if (!L) break;
      }
    }
    if (L) { const r = Layout.rowAt(Input.y + Layout.lift(Input.x)), c = Layout.colAt(Input.x); L.hover = { r, c }; }
  } else if (G.screen === 'zen') zenUpdate(dt);
  // drag release: aimed plants fire where the pointer is let go
  if (Input.released && G.screen === 'level' && L && L.selected && L.selected.kind === 'cob' && !UI.pause && L.state === 'playing') {
    const r = Layout.rowAt(Input.y + Layout.lift(Input.x)), c = Layout.colAt(Input.x); const p = L.selected.plant;
    if (r >= 0 && r < Layout.rows && c >= 0 && c < COLS && !(r === p.row && (c === p.col || (p.wide && c === p.col + 1)))) { if (PB[p.type].fireAt(p, r, c)) L.selected = null; }
  }
  // clicks
  if (Input.clicked) {
    switch (G.screen) {
      case 'menu': menuClick(); break;
      case 'select': selectClick(); break;
      case 'seeds': seedsClick(); break;
      case 'almanac': almanacClick(); break;
      case 'shop': shopClick(); break;
      case 'zen': zenClick(); break;
      case 'options': optionsClick(); break;
      case 'dave': daveClick(); break;
      case 'cutscene': cutsceneClick(); break;
      case 'level': if (L) levelClick(); break;
    }
  }
  // draw (button hit-boxes are rebuilt every frame by the draw code)
  G.ui = {};
  ctx.save(); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.restore();
  if (G.screen === 'menu' && Save.data.pendingCutscene) { Save.data.pendingCutscene = false; Save.save(); startCutscene(() => goMenu()); }
  switch (G.screen) {
    case 'menu': drawMenu(); break;
    case 'select': drawSelect(); break;
    case 'seeds': drawSeeds(); break;
    case 'almanac': drawAlmanac(); break;
    case 'shop': drawShop(); break;
    case 'zen': drawZen(); break;
    case 'options': drawOptions(); break;
    case 'dave': drawDave(); break;
    case 'cutscene': drawCutscene(dt); break;
    case 'level': if (L) { renderLevel(); if (UI.pause) drawPause(); } break;
  }
  Input.endFrame();
}
requestAnimationFrame(frame);

// debugging / automation hooks
window.__pvz = { G, get L() { return L; }, Save, PLANTS, ZOMBIES, ADVENTURE, MINIGAMES, VASEBREAKER, IZOMBIE, SURVIVAL, startLevel, beginLevel, updateLevel, placePlant, spawnZombie, canPlace, RNG, Layout, UI, goMenu, applyLevelWin };
